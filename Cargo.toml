[package]
name = "agent-works"
version = "0.4.1"
edition = "2024"
description = "Batteries-included Agent toolbox built on agent-base"
license = "MIT"
repository = "https://github.com/hibuka-labs/agent-works"
readme = "README.md"
keywords = ["agent", "ai", "llm", "mcp", "tool-calling"]
categories = ["development-tools", "asynchronous"]

[features]
default = ["compression"]
mcp = []
skill = []
prompt_skill = ["serde_yaml", "skill"]
yaml_skill = ["serde_yaml"]
hot-reload = ["dep:notify", "prompt_skill"]
cli = []
focus = []
compression = []
multi_agent = []
full = ["mcp", "skill", "cli", "prompt_skill", "yaml_skill", "hot-reload", "focus", "multi_agent", "compression"]

[dependencies]
agent-base = { version = "0.3.1" }
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
reqwest = { version = "0.13", features = ["json"] }
serde_yaml = { version = "0.9", optional = true }
notify = { version = "7", optional = true, default-features = false, features = ["macos_kqueue"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
anyhow = "1"
tempfile = "3"
serial_test = "3"
tokio-util = "0.7"
wiremock = "0.6"

[[bench]]
name = "agent_builder"
harness = false

[[example]]
name = "skill_demo"
required-features = ["skill"]

[[example]]
name = "cli_demo"
required-features = ["cli"]

[[example]]
name = "mcp_demo"
required-features = ["mcp"]
